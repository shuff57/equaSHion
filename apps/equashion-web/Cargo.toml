[package]
name = "equashion-web"
description = "equaSHion on the web: the equation editor with Copy as LaTeX, MathML, OMML, text, image and SVG, in one eframe web app (WebGL2 via glow)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "equashion-web"
path = "src/main.rs"

[dependencies]
equashion-math = { workspace = true }
equashion-layout = { workspace = true, features = ["extra-fonts"] }
equashion-render = { workspace = true, features = ["raster", "extra-fonts"] }
equashion-egui = { workspace = true }
png = "0.18"
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# glow = WebGL2 only (no wgpu, no WebGPU): works in headless Chromium and keeps the wasm small.
eframe = { workspace = true, features = ["default_fonts", "glow"] }
# Pinned to the installed wasm-bindgen CLI (trunk uses it instead of downloading one).
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Performance", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "CssStyleDeclaration", "Location", "MediaQueryList",
    "Navigator", "Storage", "Event", "EventTarget", "ClipboardEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList",
    "HtmlDocument", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader", "Headers", "Request", "RequestInit", "Response",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { workspace = true }
