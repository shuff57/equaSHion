<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>equaSHion</title>
  <link data-trunk rel="rust" data-bin="equashion-web" data-wasm-opt="z" />
  <style>
    /* Page colours before the first frame: the bg tokens of src/theme.rs. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f6f7; color: #5c5c66; }
    @media (prefers-color-scheme: dark) { html, body { background: #141416; color: #a3a3ad; } }
    #equashion_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #equashion_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
  <script>
    // Clipboard and download helpers for the Copy buttons (called from src/web.rs).
    // items maps MIME types to a string or a Uint8Array. Each returns a Promise of
    // 'copied', 'downloaded' or 'blocked'.
    window.equashionClipboard = {
      write: async function (items) {
        const mimes = Object.keys(items);
        const binary = mimes.some(function (m) { return typeof items[m] !== 'string'; });
        if (!binary && document.queryCommandSupported && document.queryCommandSupported('copy')) {
          // A copy event writes every text type exactly as given (text/html is not rewritten).
          // Capture it on window before eframe's own copy handler sees it.
          let done = false;
          const onCopy = function (e) {
            e.stopImmediatePropagation();
            e.preventDefault();
            for (const m of mimes) e.clipboardData.setData(m, items[m]);
            done = true;
          };
          window.addEventListener('copy', onCopy, true);
          try {
            if (document.execCommand('copy') && done) return 'copied';
          } catch (_) {
          } finally {
            window.removeEventListener('copy', onCopy, true);
          }
        }
        const clip = navigator.clipboard;
        if (!clip) return 'blocked';
        try {
          if (!binary && mimes.length === 1 && clip.writeText) {
            await clip.writeText(items[mimes[0]]);
            return 'copied';
          }
          if (typeof ClipboardItem === 'undefined' || !clip.write) return 'blocked';
          const blobs = {};
          for (const m of mimes) blobs[m] = new Blob([items[m]], { type: m });
          await clip.write([new ClipboardItem(blobs)]);
          return 'copied';
        } catch (_) {
          return 'blocked';
        }
      },
      download: async function (name, items) {
        try {
          const m = Object.keys(items)[0];
          const url = URL.createObjectURL(new Blob([items[m]], { type: m }));
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
          return 'downloaded';
        } catch (_) {
          return 'blocked';
        }
      },
    };
    // The "Report an issue" form (called from src/web.rs). send(json) POSTs a report to this
    // origin and resolves to 'sent' or a reason in words. pickScreenshot() opens the file picker
    // and resolves to {name, dataUrl}, {error} or null (cancelled). An image pasted while the
    // form is open is kept in `pasted` for the page to take.
    window.equashionReport = {
      pasted: null,
      send: async function (json) {
        try {
          const r = await fetch('/api/issue-reports', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: json,
          });
          if (r.ok) return 'sent';
          let why = '';
          try { why = (await r.json()).error || ''; } catch (_) {}
          return why || ('The server answered ' + r.status + '.');
        } catch (_) {
          return 'The network is unavailable.';
        }
      },
      // The public list. Resolves to {reports:[...]} (each with `voted` from this browser's
      // memory) or {error}.
      list: async function () {
        try {
          const r = await fetch('/api/issue-reports', { headers: { accept: 'application/json' } });
          const data = await r.json().catch(function () { return {}; });
          if (!r.ok) return { error: data.error || ('The server answered ' + r.status + '.') };
          const mine = this.voted();
          return { reports: (data.reports || []).map(function (x) { return Object.assign({}, x, { voted: mine.indexOf(String(x.id)) >= 0 }); }) };
        } catch (_) {
          return { error: 'The network is unavailable.' };
        }
      },
      // One vote. Resolves to {votes} or {error}; a counted vote is remembered in this browser.
      vote: async function (id) {
        try {
          const r = await fetch('/api/issue-reports/vote', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: String(id) }),
          });
          const data = await r.json().catch(function () { return {}; });
          if (!r.ok) return { error: data.error || ('The server answered ' + r.status + '.') };
          const mine = this.voted();
          if (mine.indexOf(String(id)) < 0) {
            mine.push(String(id));
            try { localStorage.setItem('equashion.voted', JSON.stringify(mine)); } catch (_) {}
          }
          return { votes: data.votes };
        } catch (_) {
          return { error: 'The network is unavailable.' };
        }
      },
      voted: function () {
        try { return JSON.parse(localStorage.getItem('equashion.voted') || '[]'); } catch (_) { return []; }
      },
      readFile: function (file) {
        return new Promise(function (resolve) {
          if (!file || !/^image\//.test(file.type)) {
            resolve({ error: 'Screenshots must be images (PNG, JPEG, GIF or WebP).' });
            return;
          }
          const fr = new FileReader();
          fr.onload = function () { resolve({ name: file.name || 'pasted image', dataUrl: String(fr.result) }); };
          fr.onerror = function () { resolve({ error: 'That image could not be read.' }); };
          fr.readAsDataURL(file);
        });
      },
      pickScreenshot: function () {
        const self = this;
        return new Promise(function (resolve) {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/png,image/jpeg,image/gif,image/webp';
          input.style.display = 'none';
          input.addEventListener('change', function () {
            const f = input.files && input.files[0];
            input.remove();
            resolve(f ? self.readFile(f) : null);
          });
          input.addEventListener('cancel', function () { input.remove(); resolve(null); });
          document.body.appendChild(input);
          input.click();
        });
      },
    };
    window.addEventListener('paste', function (e) {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type && it.type.indexOf('image/') === 0) {
          const f = it.getAsFile();
          if (f) window.equashionReport.readFile(f).then(function (v) { window.equashionReport.pasted = v; });
          return;
        }
      }
    }, true);
  </script>
</head>
<body>
  <canvas id="equashion_canvas"></canvas>
  <div id="equashion_loading">Loading equaSHion&hellip;</div>
</body>
</html>
