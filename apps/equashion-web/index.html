<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>equaSHion</title>
  <link data-trunk rel="rust" data-bin="equashion-web" data-wasm-opt="z" />
  <!-- The favicon: the SH set as a fraction (assets/logo). The SVG follows the system theme from
       inside the file; the .ico is the fallback and what /favicon.ico requests resolve to. -->
  <link data-trunk rel="copy-file" href="../../assets/logo/favicon.svg" />
  <link data-trunk rel="copy-file" href="../../assets/logo/favicon.ico" />
  <link data-trunk rel="copy-file" href="../../assets/logo/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" sizes="any" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* Page colours before the first frame: the bg tokens of src/theme.rs. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f6f7; color: #5c5c66; }
    @media (prefers-color-scheme: dark) { html, body { background: #141416; color: #a3a3ad; } }
    #equashion_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #equashion_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; pointer-events: none; }
    /* Buy Me a Coffee: the egui mug (src/fab.rs) clicks BMC's own chip, which stays out of sight, and
       the payment panel hangs down from under the mug instead of up from the bottom. BMC ships
       !important rules and a min-height of 680px, so the min is released here and the height is
       capped by src/web.rs. dvh, so a phone's own bars do not hide the bottom of it. */
    #bmc-wbtn { opacity: 0 !important; pointer-events: none !important; }
    iframe#bmc-iframe, iframe[src*="buymeacoffee.com"] { bottom: auto !important; top: 132px !important; min-height: 0 !important;
      transform-origin: right top !important; max-height: calc(100vh - 156px) !important; max-height: calc(100dvh - 156px) !important; }
    @media (min-width: 640px) { iframe#bmc-iframe, iframe[src*="buymeacoffee.com"] { right: 24px !important; } }
    /* BMC injects an empty thank-you div (no class, no id, position: fixed) that would draw as a stray box. */
    body > div[style*="position: fixed"]:not([id]):not([class]):not([style*="top: 0"]):not([style*="top:0"]) { display: none !important; }
  </style>
</head>
<body>
  <canvas id="equashion_canvas"></canvas>
  <!-- Buy Me a Coffee: BMC's hosted widget (cdnjs.buymeacoffee.com) is the payment surface, the only
       third-party request this page makes and only when it loads. The mug, the invitation and the
       report buttons are egui (src/fab.rs); src/web.rs clicks the widget's own button. To switch
       handles, change data-id. -->
  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="shuff57" data-description="Support me on Buy me a coffee!" data-message="" data-color="#FFE08A" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
  <div id="equashion_loading">Loading equaSHion&hellip;</div>
</body>
</html>
