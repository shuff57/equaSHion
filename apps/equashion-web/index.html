<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>equaSHion</title>
  <link data-trunk rel="rust" data-bin="equashion-web" data-wasm-opt="z" />
  <!-- The Report a Bug button and panel (a page element over the canvas). -->
  <link data-trunk rel="copy-file" href="report.js" />
  <style>
    /* Page colours before the first frame: the bg tokens of src/theme.rs. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f6f7; color: #5c5c66; }
    @media (prefers-color-scheme: dark) { html, body { background: #141416; color: #a3a3ad; } }
    #equashion_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #equashion_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
  <script>
    // Clipboard and download helpers for the Copy buttons (called from src/web.rs).
    // items maps MIME types to a string or a Uint8Array. Each returns a Promise of
    // 'copied', 'downloaded' or 'blocked'.
    window.equashionClipboard = {
      write: async function (items) {
        const mimes = Object.keys(items);
        const binary = mimes.some(function (m) { return typeof items[m] !== 'string'; });
        if (!binary && document.queryCommandSupported && document.queryCommandSupported('copy')) {
          // A copy event writes every text type exactly as given (text/html is not rewritten).
          // Capture it on window before eframe's own copy handler sees it.
          let done = false;
          const onCopy = function (e) {
            e.stopImmediatePropagation();
            e.preventDefault();
            for (const m of mimes) e.clipboardData.setData(m, items[m]);
            done = true;
          };
          window.addEventListener('copy', onCopy, true);
          try {
            if (document.execCommand('copy') && done) return 'copied';
          } catch (_) {
          } finally {
            window.removeEventListener('copy', onCopy, true);
          }
        }
        const clip = navigator.clipboard;
        if (!clip) return 'blocked';
        try {
          if (!binary && mimes.length === 1 && clip.writeText) {
            await clip.writeText(items[mimes[0]]);
            return 'copied';
          }
          if (typeof ClipboardItem === 'undefined' || !clip.write) return 'blocked';
          const blobs = {};
          for (const m of mimes) blobs[m] = new Blob([items[m]], { type: m });
          await clip.write([new ClipboardItem(blobs)]);
          return 'copied';
        } catch (_) {
          return 'blocked';
        }
      },
      download: async function (name, items) {
        try {
          const m = Object.keys(items)[0];
          const url = URL.createObjectURL(new Blob([items[m]], { type: m }));
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
          return 'downloaded';
        } catch (_) {
          return 'blocked';
        }
      },
    };
  </script>
</head>
<body>
  <canvas id="equashion_canvas"></canvas>
  <script src="report.js"></script>
  <div id="equashion_loading">Loading equaSHion&hellip;</div>
</body>
</html>
