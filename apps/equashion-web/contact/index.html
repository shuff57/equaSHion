<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - equaSHion</title>
  <meta name="description" content="Send the equaSHion team a message: a question, a problem, or an idea for the equation editor.">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" sizes="any" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="../"><img src="equashion-wordmark.svg" alt="equaSHion" width="137" height="40"></a>
    <a class="back" href="../">Back to the editor</a>
  </header>
  <main>
    <h1>Contact</h1>
    <p class="lede">A question, a problem, or an idea for the equation editor? Send a message and we&rsquo;ll reply by email.</p>
    <section class="panel" aria-label="Send a message">
      <div data-lhd-contact data-site="equashion"></div>
      <noscript><p>The contact form needs JavaScript. You can also open an issue on <a href="https://github.com/shuff57/equaSHion/issues">GitHub</a>.</p></noscript>
    </section>
    <p class="fine">Found a bug? The <strong>Report a Bug</strong> button in the editor files it with the equation attached, and the project lives on <a href="https://github.com/shuff57/equaSHion">GitHub</a>.</p>
  </main>
  <script src="https://contact.lefthanddev.com/embed.js" defer></script>
</body>
</html>
